name: Build on minimum supported platforms

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      identifier:
        required: true
        type: string
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ inputs.identifier || github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-on-minimum-supported-platforms:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - scheme: AWSAppSyncApolloExtensions
            os: iOS # Swift 5.9 (Xcode 15.0), iOS v13
            sdk: iphonesimulator18.0
            destination: platform=iOS Simulator,name=iPhone 16,OS=18.0
            runner: macos-15
            app: Xcode_16.0.0
          - scheme: AWSAppSyncApolloExtensions
            os: macOS # Swift 5.9 (Xcode 15.0), macOS v10_15
            sdk: macosx15.0
            destination: platform=OS X,arch=x86_64
            runner: macos-15
            app: Xcode_16.0.0
          - scheme: AWSAppSyncApolloExtensions
            os: watchOS # Swift 5.9 (Xcode 15.0), watchOS v9
            sdk: watchsimulator11.0
            destination: platform=watchOS Simulator,name=Apple Watch Series 8 (45mm),OS=11.0
            runner: macos-15
            app: Xcode_16.0.0
          - scheme: AWSAppSyncApolloExtensions
            os: tvOS # Swift 5.9 (Xcode 15.0), tvOS v13
            sdk: appletvsimulator18.0
            destination: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=18.0
            runner: macos-15
            app: Xcode_16.0.0

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: ${{ matrix.os }}
        run: |
          sudo xcode-select -s "/Applications/${{ matrix.app }}.app"
          xcodebuild build \
          -scheme ${{ matrix.scheme }} \
          -destination "${{ matrix.destination }}" \
          -sdk ${{ matrix.sdk }} \
          | xcpretty --simple --color --report junit && exit ${PIPESTATUS[0]}
